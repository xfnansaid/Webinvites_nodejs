# ============================================================
# Daily Invitation Expiry Cron Job
# ============================================================
# Runs /api/cron/expire-invitations every day at 2:00 AM IST
# (8:30 PM UTC the day before, which is 02:00 IST).
#
# This marks expired free tier (21 days) and premium (3 days after event)
# invitations as inactive, and cleans up old page views.
#
# Required GitHub Secrets:
#   CRON_SECRET    – Same value as in your production .env
#   SITE_URL       – Your production URL (e.g. https://webinvites.com)
#
# Schedule: Daily at 02:00 IST (20:30 UTC previous day)
#   IST = UTC + 5:30
#   02:00 IST = 20:30 UTC

name: Expire Invitations Cron

on:
  schedule:
    # Daily at 20:30 UTC = 02:00 IST
    - cron: '30 20 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  expire-invitations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run expire-invitations cron
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "❌ Missing required secrets: SITE_URL and CRON_SECRET"
            exit 1
          fi

          echo "🔄 Running expire-invitations cron at $(date -u)..."
          echo "   Target: ${SITE_URL}/api/cron/expire-invitations"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/expire-invitations")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "📡 Response (HTTP ${HTTP_CODE}):"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Cron job failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Check if the response indicates success
          SUCCESS=$(echo "$BODY" | jq -r '.success' 2>/dev/null)
          if [ "$SUCCESS" != "true" ]; then
            echo "⚠️ Cron job reported failure"
            exit 1
          fi

          echo "✅ Cron job completed successfully"
          echo "   Free expired: $(echo "$BODY" | jq -r '.freeTierExpired')"
          echo "   Premium expired: $(echo "$BODY" | jq -r '.premiumExpired')"
          echo "   Page views cleaned: $(echo "$BODY" | jq -r '.pageViewsCleaned')"
